<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sort Express — Playable Ad Prototype</title>
<style>
  :root{
    --deep:#0E2570;
    --blue:#1E45A8;
    --cubby:#2B4E9E;
    --edge:#A8CCF0;
    --slot:rgba(0,0,0,.22);
    --green:#3FD06A;
    --orange:#FF9A1F;
    --wood:#B4762F;
    --cream:#FFF3DC;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none}
  html,body{height:100%;overflow:hidden;background:#08163F;
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif}
  body{display:flex;align-items:center;justify-content:center}

  #stage{position:relative;width:100%;max-width:420px;height:100%;max-height:880px;
    background:radial-gradient(120% 75% at 50% 12%, var(--blue) 0%, var(--deep) 70%);
    display:flex;flex-direction:column;overflow:hidden;touch-action:none}

  /* ---------- HUD ---------- */
  #hud{display:flex;align-items:center;gap:10px;padding:16px 16px 4px}
  #lvl{background:#12225E;color:var(--cream);font-size:13px;font-weight:800;
    padding:7px 14px;border-radius:10px;letter-spacing:.02em;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
  #timer{margin-left:auto;background:#12225E;color:#fff;font-size:17px;font-weight:900;
    padding:6px 18px;border-radius:12px;font-variant-numeric:tabular-nums;
    box-shadow:inset 0 0 0 3px var(--green)}
  #timer.hot{box-shadow:inset 0 0 0 3px #FF5A5F;animation:beat .55s infinite}
  #timer.off{display:none}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  #goal{margin:8px 16px 0;height:24px;border-radius:99px;background:rgba(0,0,0,.28);
    position:relative;overflow:hidden}
  #goalFill{height:100%;width:0;background:linear-gradient(90deg,var(--green),#8BF0AB);
    transition:width .4s cubic-bezier(.2,.9,.3,1)}
  #goalTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff}

  /* ---------- Cubbies ---------- */
  #board{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;
    align-content:center;padding:14px 16px}
  .cubby{background:var(--cubby);border:3px solid var(--edge);border-radius:14px;
    padding:7px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;
    box-shadow:0 5px 0 rgba(0,0,0,.28)}
  .cubby.jam{border-color:#FF5A5F;animation:jam 1s infinite}
  @keyframes jam{0%,100%{box-shadow:0 5px 0 rgba(0,0,0,.28)}
    50%{box-shadow:0 5px 0 rgba(0,0,0,.28),0 0 16px 2px rgba(255,90,95,.85)}}

  .slot{aspect-ratio:1/1;border-radius:8px;background:var(--slot);
    display:flex;align-items:center;justify-content:center;font-size:27px;
    transition:background .15s ease,transform .12s ease}
  .slot img{width:82%;height:82%;object-fit:contain;pointer-events:none;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
  .slot.filled{cursor:grab;touch-action:none}
  .slot.filled:active{cursor:grabbing}
  .slot.open{background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 2px rgba(168,204,240,.55)}
  .slot.hover{background:rgba(255,255,255,.30);transform:scale(1.07)}
  .slot.lift{opacity:.25}
  .slot.pop{animation:pop .34s ease forwards}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28) rotate(6deg)}
    100%{transform:scale(0);opacity:0}}
  .slot.arrive{animation:arrive .3s cubic-bezier(.2,1.5,.4,1)}
  @keyframes arrive{0%{transform:translateY(-16px) scale(.7);opacity:0}100%{transform:none;opacity:1}}

  #ghost{position:fixed;z-index:20;width:64px;height:64px;pointer-events:none;
    transform:translate(-50%,-55%) scale(1.15);display:none}
  #ghost img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.55))}

  /* ---------- Bottom shelf / tip ---------- */
  #shelf{margin:0 16px 16px;background:linear-gradient(180deg,#C98A3C,var(--wood));
    border-radius:10px;padding:10px 12px;text-align:center;
    box-shadow:0 4px 0 rgba(0,0,0,.35)}
  #tip{color:#3A2107;font-size:13px;font-weight:800;letter-spacing:.01em}

  /* ---------- Hand ---------- */
  #hand{position:absolute;z-index:15;font-size:36px;pointer-events:none;opacity:0;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.55));transition:opacity .2s ease}
  #hand.show{opacity:1}

  /* ---------- CTA ---------- */
  #cta{position:absolute;left:50%;bottom:-80px;transform:translateX(-50%);
    background:var(--orange);color:#3A2107;border:none;padding:13px 32px;border-radius:99px;
    font-size:16px;font-weight:900;box-shadow:0 5px 0 #C46F08;cursor:pointer;z-index:16;
    transition:bottom .45s cubic-bezier(.2,.9,.3,1)}
  #cta.up{bottom:78px}

  /* ---------- End card ---------- */
  #end{position:absolute;inset:0;background:rgba(8,22,63,.88);display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:26px;text-align:center;z-index:18}
  #end.show{display:flex;animation:fade .3s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  #end h1{color:#fff;font-size:31px;font-weight:900;line-height:1.08;letter-spacing:-.02em}
  #end p{color:rgba(255,255,255,.72);font-size:14px;max-width:250px;line-height:1.45}
  #endCta{background:var(--orange);color:#3A2107;border:none;padding:16px 44px;border-radius:99px;
    font-size:19px;font-weight:900;box-shadow:0 5px 0 #C46F08;cursor:pointer}
  #replay{background:none;border:none;color:rgba(255,255,255,.6);font-size:13px;
    text-decoration:underline;cursor:pointer;padding:6px}
  #metrics{margin-top:4px;width:100%;max-width:268px;border-top:1px solid rgba(255,255,255,.16);
    padding-top:10px;color:rgba(255,255,255,.55);font-size:11px;text-align:left;
    font-variant-numeric:tabular-nums;line-height:1.75}
  #metrics b{color:var(--green);float:right;font-weight:700}
  #metrics .head{color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.14em;
    font-size:9px;margin-bottom:3px}

  /* ---------- Variant switch (prototype control) ---------- */
  #variant{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:19;
    display:flex;border-radius:99px;overflow:hidden;border:1px solid rgba(255,255,255,.2);
    font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.45}
  #variant button{background:transparent;border:none;color:#fff;padding:4px 9px;cursor:pointer}
  #variant button.on{background:var(--green);color:#08163F}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage">
  <div id="variant"><button id="vA" class="on">A · timer</button><button id="vB">B · no timer</button></div>

  <div id="hud">
    <div id="lvl">Level 26</div>
    <div id="timer">0:25</div>
  </div>
  <div id="goal"><div id="goalFill"></div><div id="goalTxt">0 / 4 shelves cleared</div></div>

  <div id="board"></div>

  <div id="shelf"><div id="tip">Drag an item onto a matching pair</div></div>

  <div id="hand">👆</div>
  <div id="ghost"></div>
  <button id="cta">Play now</button>

  <div id="end">
    <h1>Shelf cleared!</h1>
    <p>Level 26 is waiting. How fast can you sort the rest?</p>
    <button id="endCta">Play Sort Express</button>
    <button id="replay">Try again</button>
    <div id="metrics">
      <div class="head">Captured signals</div>
      <div>Time to first drag <b id="mFirst">–</b></div>
      <div>Playtime <b id="mPlay">–</b></div>
      <div>Drags <b id="mDrags">–</b></div>
      <div>Shelves cleared <b id="mSets">–</b></div>
      <div>Idle hints shown <b id="mHints">–</b></div>
    </div>
  </div>
</div>

     holds two of the same item -> the three collect -> that cubby refills
     with items from the back.

   The flow is authored, not random. A one-move solution always exists,
   nothing is ever penalised, and the timer never reaches zero.

};
const BASE  = ["mug","teapot","console"];
const LATER = ["flakes"];              // arrives from the back on the 2nd clear
const img = t => `<img src="${ART[t]}" alt="">`;

const boardEl = document.getElementById("board");
const timerEl = document.getElementById("timer");
const goalFill= document.getElementById("goalFill");
const goalTxt = document.getElementById("goalTxt");
const tipEl   = document.getElementById("tip");
const handEl  = document.getElementById("hand");
const ghostEl = document.getElementById("ghost");
const ctaEl   = document.getElementById("cta");
const endEl   = document.getElementById("end");
const stageEl = document.getElementById("stage");

let cubbies, cleared, drags, firstDragAt, startedAt, hintsShown;
let ended, busy, variant="A", timeLeft, clock, idleTimer, newTypesIn;

/* ---------------- board queries ---------------- */

const flat = () => cubbies.flat().filter(Boolean);
const openSlots = () => {
  const out=[];
  cubbies.forEach((cb,ci)=>cb.forEach((v,si)=>{ if(!v) out.push([ci,si]); }));
  return out;
};
function typesIn(ci){
  const m={}; cubbies[ci].forEach(v=>{ if(v) m[v]=(m[v]||0)+1; });
  return m;
}

/* The move the player is meant to find: a cubby holding two of a kind
   with a free slot, and a third of that kind sitting somewhere else. */
function findMove(){
  for(let ci=0;ci<CUBBIES;ci++){
    if(!cubbies[ci].includes(null)) continue;
    const m=typesIn(ci);
    for(const t in m){
      if(m[t]!==2) continue;
      for(let cj=0;cj<CUBBIES;cj++){
        if(cj===ci) continue;
        const si=cubbies[cj].indexOf(t);
        if(si>-1) return {from:[cj,si], to:[ci,cubbies[ci].indexOf(null)], type:t};
      }
    }
  }
  return null;
}

/* ---------------- render ---------------- */

function build(){
  boardEl.innerHTML="";
  for(let ci=0;ci<CUBBIES;ci++){
    const cb=document.createElement("div");
    cb.className="cubby"; cb.dataset.ci=ci;
    for(let si=0;si<SLOTS;si++){
      const s=document.createElement("div");
      s.className="slot"; s.dataset.ci=ci; s.dataset.si=si;
      cb.appendChild(s);
    }
    boardEl.appendChild(cb);
  }
  paint();
}
const slotEl=(ci,si)=>boardEl.querySelector(`.slot[data-ci="${ci}"][data-si="${si}"]`);

function paint(){
  for(let ci=0;ci<CUBBIES;ci++) for(let si=0;si<SLOTS;si++){
    const el=slotEl(ci,si), v=cubbies[ci][si];
    el.innerHTML = v ? img(v) : "";
    el.classList.toggle("filled",!!v);
    el.classList.toggle("open",!v);
  }
  goalTxt.textContent=`${cleared} / ${GOAL} shelves cleared`;
  goalFill.style.width=Math.min(100,(cleared/GOAL)*100)+"%";
  const tight=openSlots().length<=1 && !ended;
  boardEl.querySelectorAll(".cubby").forEach(c=>c.classList.toggle("jam",tight));
}

/* ---------------- drag ---------------- */

let drag=null;

stageEl.addEventListener("pointerdown",e=>{
  if(ended||busy) return;
  const el=e.target.closest(".slot");
  if(!el||!el.classList.contains("filled")) return;
  const ci=+el.dataset.ci, si=+el.dataset.si;
  drag={ci,si,type:cubbies[ci][si],el};
  el.classList.add("lift");
  ghostEl.innerHTML=img(drag.type);
  ghostEl.style.display="block";
  moveGhost(e.clientX,e.clientY);
  hideHand(); resetIdle();
  e.preventDefault();
});

window.addEventListener("pointermove",e=>{
  if(!drag) return;
  moveGhost(e.clientX,e.clientY);
  const over=dropTarget(e.clientX,e.clientY);
  boardEl.querySelectorAll(".hover").forEach(x=>x.classList.remove("hover"));
  if(over) over.classList.add("hover");
});

window.addEventListener("pointerup",e=>{
  if(!drag) return;
  const over=dropTarget(e.clientX,e.clientY);
  ghostEl.style.display="none";
  drag.el.classList.remove("lift");
  boardEl.querySelectorAll(".hover").forEach(x=>x.classList.remove("hover"));
  if(over) drop(+over.dataset.ci,+over.dataset.si);   // wrong drop = nothing happens
  drag=null;
});

function moveGhost(x,y){ ghostEl.style.left=x+"px"; ghostEl.style.top=y+"px"; }

function dropTarget(x,y){
  const el=document.elementFromPoint(x,y);
  const s=el&&el.closest?el.closest(".slot"):null;
  if(!s) return null;
  if(cubbies[+s.dataset.ci][+s.dataset.si]) return null;   // occupied
  return s;
}

function drop(ci,si){
  drags++;
  if(firstDragAt===null) firstDragAt=(performance.now()-startedAt)/1000;
  cubbies[drag.ci][drag.si]=null;
  cubbies[ci][si]=drag.type;
  paint();
  const el=slotEl(ci,si); el.classList.add("arrive");
  setTimeout(()=>el.classList.remove("arrive"),300);
  checkCubby(ci);
}

/* ---------------- collect + refill ---------------- */

function checkCubby(ci){
  const cb=cubbies[ci];
  if(cb.some(v=>!v)) return;
  if(!(cb[0]===cb[1]&&cb[1]===cb[2])) return;

  busy=true;
  for(let si=0;si<SLOTS;si++){
    const el=slotEl(ci,si); el.classList.add("pop");
    setTimeout(()=>el.classList.remove("pop"),340);
  }
  cubbies[ci]=[null,null,null];
  cleared++;
  setTimeout(()=>{
    paint();
    if(cleared>=GOAL){ busy=false; return finish(); }
    refill(ci);
  },340);
}

/* Items arrive from the back. What arrives is chosen, not rolled:
   always a pair whose third copy is already on the board. */
function refill(ci){
  const pool = cleared>=2 ? BASE.concat(LATER) : BASE.slice();
  if(cleared===2 && !newTypesIn){ newTypesIn=true; tipEl.textContent="New items from the back!"; }

  const onBoard = flat();
  let pair = pool.filter(t=>onBoard.includes(t));
  if(!pair.length) pair = pool;
  const t = pair[Math.floor(Math.random()*pair.length)];

  // two of a kind land in front, the third slot stays open for the player
  const spots=[0,1,2].sort(()=>Math.random()-.5);
  cubbies[ci][spots[0]]=t; cubbies[ci][spots[1]]=t;

  // third clear tightens the cabinet: fillers take every other free slot
  if(cleared===3){
    openSlots().forEach(([cj,sj])=>{
      if(cj===ci) return;
      cubbies[cj][sj]=pool[Math.floor(Math.random()*pool.length)];
    });
    tipEl.textContent="Almost full — clear a shelf!";
  }

  guarantee(ci,t);
  paint();
  [spots[0],spots[1]].forEach((s,i)=>{
    const el=slotEl(ci,s);
    setTimeout(()=>{ el.classList.add("arrive");
      setTimeout(()=>el.classList.remove("arrive"),300); }, i*90);
  });
  busy=false; resetIdle();
}

/* Safety net: if the board somehow has no one-move solution, plant one
   by relabelling a single item somewhere else. */
function guarantee(ci,t){
  if(findMove()) return;
  for(let cj=0;cj<CUBBIES;cj++){
    if(cj===ci) continue;
    for(let sj=0;sj<SLOTS;sj++){
      if(cubbies[cj][sj]){ cubbies[cj][sj]=t; return; }
    }
  }
}

/* ---------------- hint ---------------- */

function showHand(){
  if(ended||busy) return;
  const mv=findMove(); if(!mv) return;
  const a=slotEl(...mv.from).getBoundingClientRect();
  const b=slotEl(...mv.to).getBoundingClientRect();
  const s=stageEl.getBoundingClientRect();
  handEl.classList.add("show");
  const go=(r)=>{ handEl.style.left=(r.left-s.left+r.width*.45)+"px";
                  handEl.style.top =(r.top -s.top +r.height*.4)+"px"; };
  go(a);
  handEl.style.transition="opacity .2s ease";
  setTimeout(()=>{ handEl.style.transition="left .8s ease,top .8s ease,opacity .2s ease"; go(b); },420);
  setTimeout(()=>{ if(handEl.classList.contains("show")){ handEl.style.transition="opacity .2s ease"; go(a);
    setTimeout(()=>{ if(handEl.classList.contains("show")){
      handEl.style.transition="left .8s ease,top .8s ease,opacity .2s ease"; go(b);} },420); } },1900);
  slotEl(...mv.from).classList.add("hover");
  setTimeout(()=>slotEl(...mv.from).classList.remove("hover"),700);
  hintsShown++;
}
function hideHand(){ handEl.classList.remove("show"); }
function resetIdle(){ clearTimeout(idleTimer); idleTimer=setTimeout(showHand,1600); }

/* ---------------- clock ---------------- */

function tick(){
  if(ended) return;
  timeLeft-=0.1;
  if(timeLeft<=4){ timeLeft=4; timerEl.classList.add("hot"); }   // never hits zero
  timerEl.textContent="0:"+String(Math.ceil(timeLeft)).padStart(2,"0");
}

/* ---------------- end ---------------- */

function finish(){
  ended=true; clearInterval(clock); clearTimeout(idleTimer); hideHand();
  document.getElementById("mFirst").textContent=firstDragAt?firstDragAt.toFixed(1)+"s":"no drag";
  document.getElementById("mPlay").textContent=((performance.now()-startedAt)/1000).toFixed(1)+"s";
  document.getElementById("mDrags").textContent=drags;
  document.getElementById("mSets").textContent=cleared;
  document.getElementById("mHints").textContent=hintsShown;
  setTimeout(()=>endEl.classList.add("show"),420);
}

function openStore(){
  try{ if(window.mraid&&mraid.open) return mraid.open("https://apps.apple.com/app/id6739867121"); }catch(e){}
  window.open("https://apps.apple.com/app/id6739867121","_blank");
}

/* ---------------- boot ---------------- */

function start(){
  cleared=0; drags=0; firstDragAt=null; hintsShown=0;
  ended=false; busy=false; newTypesIn=false; timeLeft=25;
  endEl.classList.remove("show"); timerEl.classList.remove("hot");
  ctaEl.classList.remove("up");
  tipEl.textContent="Drag an item onto a matching pair";

  // Authored opening: the pair-plus-one situation is on screen from frame one.
  cubbies=[
    ["mug","mug",null],
    ["teapot","console","teapot"],
    ["mug","console",null],
    ["console","teapot","console"]
  ];

  build();
  startedAt=performance.now();
  clearInterval(clock); clock=setInterval(tick,100);
  resetIdle();
  setTimeout(()=>{ if(!ended) ctaEl.classList.add("up"); },5000);
  timerEl.classList.toggle("off",variant==="B");
}

vA.onclick=()=>{variant="A";vA.classList.add("on");vB.classList.remove("on");start();};
vB.onclick=()=>{variant="B";vB.classList.add("on");vA.classList.remove("on");start();};
ctaEl.onclick=openStore;
document.getElementById("endCta").onclick=openStore;
document.getElementById("replay").onclick=start;

start();
</script>
